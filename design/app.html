/* Gorilla Tables - dark shop-floor interface, Gerarden teal accent */
:root {
  --bg: #15181b;
  --panel: #1d2125;
  --raised: #262b30;
  --raised2: #2e343a;
  --line: #343a40;
  --line2: #444c54;
  --text: #dde2e6;
  --muted: #8d979f;
  --faint: #616b74;
  --teal: #19aedb;
  --teal-dim: #12789a;
  --teal-wash: rgba(25, 174, 219, 0.12);
  --amber: #f2a33a;
  --amber-wash: rgba(242, 163, 58, 0.12);
  --red: #e5534b;
  --red-wash: rgba(229, 83, 75, 0.13);
  --good: #5cc489;
  --r: 6px;
  --head: 'Barlow Semi Condensed', 'Barlow', 'Segoe UI', sans-serif;
  --body: 'Barlow', 'Segoe UI', sans-serif;
  --on-teal: #04212b; --teal-hover: #3cc0e8; --sel-text: #bfeeff;
  --err-text: #ffc9c5; --warn-text: #ffe0b0; --info-text: #c9efff;
  --view-a: #232930; --view-b: #15181b; --pic-a: #262c33; --pic-b: #181b1f;
  --glass: rgba(29,33,37,0.88); --shadow: rgba(0,0,0,0.35); --sw-ring: rgba(255,255,255,0.12); --banner-line: rgba(242,163,58,0.4);
  --etch: #7fe6ff;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef1f4; --panel: #ffffff; --raised: #f2f4f6; --raised2: #e6eaee; --line: #dbe0e5; --line2: #c3cbd2;
  --text: #1b2025; --muted: #586470; --faint: #87919a;
  --teal: #1199c4; --teal-dim: #0d7fa3; --teal-wash: rgba(17,153,196,0.10);
  --amber: #c27510; --amber-wash: rgba(214,138,30,0.12); --red: #cc3f37; --red-wash: rgba(204,63,55,0.09); --good: #23874f;
  --on-teal: #ffffff; --teal-hover: #0d88b0; --sel-text: #0a5a75;
  --err-text: #8f231d; --warn-text: #6e4305; --info-text: #0a5a75;
  --view-a: #ffffff; --view-b: #dfe4e9; --pic-a: #ffffff; --pic-b: #e7ebef;
  --glass: rgba(255,255,255,0.9); --shadow: rgba(30,40,50,0.14); --sw-ring: rgba(0,0,0,0.14); --banner-line: rgba(194,117,16,0.35);
  --etch: #0f8fb8;
  color-scheme: light;
}
/* Inside the website (?embed=1): the site's paper, ink and cyan, and its fonts (loaded by the page) */
:root[data-embed] { --body: 'DM Sans', 'Barlow', 'Segoe UI', sans-serif; --head: 'Hanken Grotesk', 'Barlow Semi Condensed', 'Barlow', sans-serif; }
:root[data-embed][data-theme="light"] {
  --bg: #f7f5f5; --panel: #ffffff; --raised: #f3f1f1; --raised2: #e9e6e2; --line: #e8e6e7; --line2: #cfcbcc;
  --text: #2c2628; --muted: #7a7577; --faint: #a8a4a5;
  --teal: #00a7e6; --teal-dim: #0089bd; --teal-wash: rgba(0,167,230,0.10); --teal-hover: #0089bd; --sel-text: #0a5a75; --etch: #0089bd;
  --view-a: #ffffff; --view-b: #e9e6e2; --pic-a: #ffffff; --pic-b: #ece9e6;
}
:root[data-embed][data-theme="dark"] { --bg: #161616; --panel: #1f1f1f; --raised: #292929; --raised2: #333333; --line: #3a3a3a; --line2: #4a4a4a; --teal: #00a7e6; --teal-hover: #3cc0e8; }
:root[data-embed] .top { height: 48px; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); font: 14px/1.45 var(--body);
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.app { display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: minmax(0, 1fr); height: 100vh; }
.app > *, .main > * { min-width: 0; }

/* top bar */
.top { display: flex; align-items: center; gap: 22px; padding: 0 18px; height: 52px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand b { font: 700 21px/1 var(--head); letter-spacing: 0.01em; }
.brand b i { font-style: normal; color: var(--teal); }
.brand span { color: var(--muted); font-size: 12.5px; }
.tabs { display: flex; gap: 2px; height: 100%; }
.tabs button { background: none; border: 0; padding: 0 14px; color: var(--muted); font: 600 15px var(--head); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--teal); }
.tabs button:hover { color: var(--text); }
.spacer { flex: 1; }
.units { display: inline-flex; border: 1px solid var(--line2); border-radius: var(--r); overflow: hidden; }
.units button { background: none; border: 0; padding: 4px 11px; color: var(--muted); font-weight: 600; }
.units button[aria-pressed="true"] { background: var(--teal); color: var(--on-teal); }
.host { color: var(--faint); font-size: 12px; }
.themebtn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid var(--line2); border-radius: var(--r); padding: 4px 10px; color: var(--muted); font-size: 13px; font-weight: 600; }
.themebtn:hover { color: var(--text); border-color: var(--muted); }
.themebtn svg { width: 16px; height: 16px; flex: none; }

/* stepper */
.steps { display: flex; align-items: stretch; background: var(--bg); border-bottom: 1px solid var(--line); padding: 0 10px; overflow-x: auto; }
.steps button {
  display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 11px 14px 10px; color: var(--muted);
  font: 600 14.5px var(--head); white-space: nowrap; position: relative;
}
.steps button .n { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line2); display: grid; place-items: center; font-size: 12px; color: var(--muted); }
.steps button[aria-current="step"] { color: var(--text); }
.steps button[aria-current="step"] .n { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
.steps button.has-err .n { border-color: var(--red); color: var(--red); }
.steps button.has-warn .n { border-color: var(--amber); color: var(--amber); }
.steps button:not(:last-child)::after { content: ''; width: 18px; height: 1px; background: var(--line2); margin-left: 12px; }
.steps button:hover { color: var(--text); }

/* main grid */
.main { display: grid; grid-template-columns: minmax(330px, 390px) 1fr minmax(260px, 300px); min-height: 0; }
.controls { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.controls .scroll { overflow-y: auto; padding: 16px 18px 24px; flex: 1; }
.controls h2 { font: 600 20px/1.2 var(--head); margin: 2px 0 4px; }
.controls .lead { color: var(--muted); margin: 0 0 16px; font-size: 13.5px; }
.nav { display: flex; justify-content: space-between; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--panel); }

.field { margin: 0 0 14px; }
.field > label, .field > .label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 5px; }
.field .hint { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.len { display: flex; align-items: center; background: var(--raised); border: 1px solid var(--line2); border-radius: var(--r); }
.len:focus-within { border-color: var(--teal); }
.len input { flex: 1; min-width: 0; background: none; border: 0; padding: 7px 9px; outline: none; font-size: 15px; }
.len .u { color: var(--muted); padding-right: 9px; font-size: 13px; }
.field.bad .len { border-color: var(--red); }
input.text { width: 100%; background: var(--raised); border: 1px solid var(--line2); border-radius: var(--r); padding: 7px 9px; outline: none; }
input.text:focus { border-color: var(--teal); }
select.sel { width: 100%; background: var(--raised); border: 1px solid var(--line2); border-radius: var(--r); padding: 7px 8px; }

.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { background: var(--raised); border: 1px solid var(--line2); border-radius: var(--r); padding: 6px 11px; color: var(--text); font-size: 13.5px; }
.seg button:hover { border-color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--teal-wash); border-color: var(--teal); color: var(--sel-text); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
.chips button { background: none; border: 1px dashed var(--line2); border-radius: 20px; padding: 3px 11px; color: var(--muted); font-size: 13px; }
.chips button:hover, .chips button[aria-pressed="true"] { border-style: solid; border-color: var(--teal); color: var(--text); }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 7px; }
.tile { background: var(--raised); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 7px 7px; text-align: center; color: var(--text); }
.tile svg { width: 100%; height: 44px; display: block; margin-bottom: 4px; }
.tile span { font-size: 12.5px; line-height: 1.2; display: block; }
.tile:hover { border-color: var(--muted); }
.tile[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-wash); }
.tiles.big { grid-template-columns: 1fr 1fr; }
.tiles.big .tile { text-align: left; padding: 10px; }
.tiles.big .tile svg { height: 56px; }
.tiles.big .tile small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

.toggle { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; cursor: pointer; }
.toggle input { appearance: none; width: 34px; height: 19px; border-radius: 10px; background: var(--line2); position: relative; flex: none; margin: 1px 0 0; cursor: pointer; transition: background .15s; }
.toggle input::after { content: ''; position: absolute; width: 15px; height: 15px; top: 2px; left: 2px; border-radius: 50%; background: var(--text); transition: left .15s; }
.toggle input:checked { background: var(--teal); }
.toggle input:checked::after { left: 17px; background: var(--on-teal); }
.toggle b { font-weight: 600; display: block; }
.toggle small { color: var(--muted); font-size: 12.5px; }

details.adv { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 10px; }
details.adv summary { cursor: pointer; color: var(--muted); font-weight: 600; list-style: none; display: flex; align-items: center; gap: 6px; padding: 4px 0 10px; }
details.adv summary::before { content: ''; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
details.adv[open] summary::before { transform: rotate(45deg); }
details.adv summary:hover { color: var(--text); }
.group-h { font: 600 15px var(--head); margin: 18px 0 8px; color: var(--text); }

.msg { border-radius: var(--r); padding: 7px 10px; font-size: 13px; margin-top: 6px; display: flex; gap: 8px; align-items: flex-start; }
.msg.err { background: var(--red-wash); color: var(--err-text); border-left: 3px solid var(--red); }
.msg.warn { background: var(--amber-wash); color: var(--warn-text); border-left: 3px solid var(--amber); }
.msg.info { background: var(--teal-wash); color: var(--info-text); border-left: 3px solid var(--teal); }
.msg .fix { margin-left: auto; flex: none; background: none; border: 1px solid currentColor; color: inherit; border-radius: 4px; padding: 1px 8px; font-size: 12.5px; }

.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
.sw { aspect-ratio: 1; border-radius: 6px; border: 2px solid transparent; position: relative; box-shadow: inset 0 0 0 1px var(--sw-ring); }
.sw[aria-pressed="true"] { border-color: var(--teal); }
.sw.raw { background: linear-gradient(135deg, #9aa3aa, #6c757c); }
.colorname { margin-top: 8px; color: var(--muted); font-size: 13px; }
.colorname b { color: var(--text); font-weight: 600; }
.cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fin { border: 1px solid var(--line2); background: var(--raised); border-radius: 8px; padding: 9px; display: flex; gap: 10px; align-items: center; text-align: left; }
.fin i { width: 34px; height: 34px; border-radius: 5px; flex: none; }
.fin[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-wash); }

/* viewport */
.view { position: relative; min-width: 0; min-height: 0; background: radial-gradient(ellipse at 50% 40%, var(--view-a) 0%, var(--view-b) 72%); }
.view .gl, .view .svgview { position: absolute; inset: 0; }
.view .gl canvas { width: 100% !important; height: 100% !important; display: block; }
.view .svgview { display: none; padding: 54px 26px 26px; }
.view .svgview svg { width: 100%; height: 100%; }
.view.mode-svg .svgview { display: block; }
.view.mode-svg .gl { visibility: hidden; }
.vbar { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; gap: 10px; align-items: center; z-index: 2; pointer-events: none; }
.vbar > * { pointer-events: auto; }
.vbar .seg button { background: var(--glass); }
.vbar .ghost { background: var(--glass); border: 1px solid var(--line2); color: var(--muted); border-radius: var(--r); padding: 6px 10px; font-size: 13px; }
.vbar .ghost:hover { color: var(--text); }
.dimread { position: absolute; left: 18px; bottom: 14px; z-index: 2; pointer-events: none; }
.dimread b { display: block; font: 700 34px/1 var(--head); letter-spacing: -0.01em; color: var(--text); }
.dimread span { color: var(--muted); font-size: 13px; }
.no-webgl::after { content: 'This computer can\'t show 3D here. Use the Top, Front and Ribs views.'; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
.legend { position: absolute; right: 16px; bottom: 14px; z-index: 2; display: flex; gap: 14px; color: var(--muted); font-size: 12.5px; }
.legend i { display: inline-block; width: 12px; height: 9px; margin-right: 5px; vertical-align: -1px; border-radius: 2px; }

/* summary column */
.summary { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px 16px 20px; }
.summary h3 { font: 600 13px var(--head); color: var(--muted); margin: 18px 0 6px; letter-spacing: 0.02em; }
.summary h3:first-child { margin-top: 0; }
.spec { font: 600 22px/1.15 var(--head); }
.spec small { display: block; font: 400 13px var(--body); color: var(--muted); margin-top: 3px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; }
.rating { display: flex; align-items: baseline; gap: 8px; }
.rating b { font: 700 26px/1 var(--head); }
.rating span { color: var(--muted); font-size: 12.5px; }
.kv.loads { margin-top: 8px; font-size: 13px; }
.kv.loads .lim { color: var(--text); font-weight: 600; }
.kv.loads dd.lim { color: var(--teal); }
.prices { display: grid; gap: 6px; }
.price { display: grid; grid-template-columns: 1fr auto; align-items: baseline; padding: 8px 10px; background: var(--raised); border-radius: var(--r); }
.price b { font: 700 19px var(--head); }
.price small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.placeholder { color: var(--amber); font-size: 12.5px; margin-top: 6px; }
.issues { display: grid; gap: 5px; }
.issues button { text-align: left; background: none; border: 0; padding: 0; }
.issues .msg { margin: 0; }
.ok-line { color: var(--good); font-size: 13.5px; }
.timing { color: var(--faint); font-size: 12px; margin-top: 14px; }

/* buttons */
.btn { border: 1px solid var(--line2); background: var(--raised); border-radius: var(--r); padding: 8px 14px; font-weight: 600; color: var(--text); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
.btn.primary:hover { background: var(--teal-hover); border-color: var(--teal-hover); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.outlist { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; color: var(--muted); font-size: 13px; }
.outlist li::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--teal); margin-right: 8px; vertical-align: 2px; }
.disclaimer { color: var(--faint); font-size: 12px; margin-top: 14px; }
.status { margin-top: 10px; font-size: 13px; color: var(--muted); }

/* full-page tabs */
.page { overflow-y: auto; padding: 22px 26px 40px; }
.page h2 { font: 600 24px var(--head); margin: 0 0 4px; }
.page .lead { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
.cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.card .pic { background: radial-gradient(ellipse at 50% 40%, var(--pic-a), var(--pic-b)); height: 150px; padding: 10px; }
.card .pic svg { width: 100%; height: 100%; }
.card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card h4 { margin: 0; font: 600 18px var(--head); }
.card .sku { color: var(--faint); font-size: 12px; }
.card .facts { color: var(--muted); font-size: 13px; }
.card .tier { display: flex; justify-content: space-between; font-size: 13px; }
.card .tier b { font-family: var(--head); font-size: 15px; }
.card .acts { display: flex; gap: 6px; margin-top: auto; padding-top: 8px; }
.card .x { margin-left: auto; background: none; border: 0; color: var(--faint); }
.card .x:hover { color: var(--red); }
.savebar { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; }
.savebar .field { margin: 0; min-width: 150px; }
.shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.shopgrid fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 4px; margin: 0; background: var(--panel); }
.shopgrid legend { font: 600 16px var(--head); padding: 0 6px; }
.num { display: flex; align-items: center; background: var(--raised); border: 1px solid var(--line2); border-radius: var(--r); }
.num input { flex: 1; min-width: 0; background: none; border: 0; padding: 6px 8px; outline: none; }
.num span { color: var(--muted); padding: 0 8px; font-size: 13px; }
.banner { background: var(--amber-wash); border: 1px solid var(--banner-line); color: var(--warn-text); border-radius: 8px; padding: 9px 12px; margin-bottom: 16px; font-size: 13.5px; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--raised2); border: 1px solid var(--line2); padding: 9px 16px; border-radius: 8px; opacity: 0; transition: all .2s; z-index: 50; pointer-events: none; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

.peek { display: none; }

/* narrow: Fusion panel docked at the side */
@media (max-width: 1080px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100vh; }
  .main { grid-template-columns: 1fr; }
  .view { height: 300px; order: 1; }
  .summary { order: 3; border-left: 0; border-top: 1px solid var(--line); max-height: none; }
  .controls { order: 2; border-right: 0; }
  .controls .scroll { overflow: visible; }
  .nav { position: sticky; bottom: 0; }
  .brand span, .host { display: none; }
  .top { gap: 10px; padding: 0 10px; }
  .tabs button { padding: 0 8px; font-size: 14px; }
  .steps button { padding: 9px 9px; }
  .steps button .t { display: none; }
  .steps button[aria-current="step"] .t { display: inline; }
}
/* phones */
@media (max-width: 640px) {
  .app { height: auto; min-height: 100dvh; }
  .top { flex-wrap: wrap; height: auto; padding: 8px 12px 0; gap: 4px 10px; }
  .brand b { font-size: 20px; }
  .units { order: 2; margin-left: auto; }
  .themebtn { order: 2; padding: 6px 8px; }
  .themebtn span { display: none; }
  .units button { padding: 6px 13px; }
  .spacer { display: none; }
  .tabs { order: 3; width: 100%; height: 40px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar, .steps::-webkit-scrollbar { display: none; }
  .tabs button { flex: 1; padding: 0 6px; font-size: 14.5px; white-space: nowrap; }
  .steps { position: sticky; top: 0; z-index: 5; padding: 0 4px; scrollbar-width: none; }
  .steps button { padding: 10px 8px; gap: 7px; }
  .steps button .n { width: 26px; height: 26px; font-size: 13px; }
  .steps button:not(:last-child)::after { width: 10px; margin-left: 7px; }
  .view { height: 46vh; min-height: 250px; max-height: 360px; }
  .vbar { top: 8px; left: 8px; right: 8px; gap: 6px; flex-wrap: wrap; }
  .vbar .seg { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
  .vbar .seg button { padding: 6px 9px; font-size: 13px; white-space: nowrap; }
  .vbar .ghost { padding: 6px 8px; font-size: 12.5px; }
  .view .svgview { padding: 50px 8px 10px; }
  .dimread { left: 12px; bottom: 10px; }
  .dimread b { font-size: 26px; }
  .legend { display: none !important; }
  .view.mode-svg .dimread { display: none; }
  .controls .scroll { padding: 16px 14px 20px; }
  .nav { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); align-items: center; z-index: 5; box-shadow: 0 -6px 16px var(--shadow); }
  .nav .btn { padding: 11px 14px; }
  .peek { display: flex; flex-direction: column; align-items: center; background: none; border: 0; padding: 0 4px; min-width: 0; line-height: 1.15; }
  .peek b { font: 700 18px var(--head); }
  .peek span { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .len input, input.text, select.sel, .num input { font-size: 16px; }   /* 16px stops iPhone zooming into fields */
  .len input, input.text, select.sel { padding: 10px 10px; }
  .seg button { padding: 9px 12px; }
  .chips button { padding: 7px 13px; }
  .tiles.big .tile svg { height: 46px; }
  .row3 { grid-template-columns: 1fr 1fr; }
  .summary { padding: 16px 14px 28px; }
  .page { padding: 16px 14px 32px; }
  .cat, .shopgrid { grid-template-columns: 1fr; }
  .savebar .field { min-width: 0; flex: 1 1 140px; }
  .toast { bottom: calc(76px + env(safe-area-inset-bottom)); max-width: calc(100vw - 24px); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.row2 > *, .row3 > * { min-width: 0; }
.len input { width: 100%; }
.tiles.big .tile { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; }
.tiles.big .tile svg { color: var(--text); }
.tiles.big .tile[aria-pressed="true"] svg { color: var(--sel-text); }

.price.off { opacity: .55; }
.price.off b { font-size: 15px; }
.card .tier.off { opacity: .5; }
.tile.filesonly { opacity: .62; }
.tile.filesonly[aria-pressed="true"] { opacity: 1; }
.tile em { display: block; font: 600 10.5px var(--body, inherit); font-style: normal; color: var(--warn, #c98a00); margin-top: 2px; letter-spacing: .02em; text-transform: uppercase; }

/* assembly plan preview */
.asm { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; height: 100%; }
.asm-pic { background: #f5f7f9; border: 1px solid var(--line2); border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 18px; min-height: 0; overflow: hidden; }
.asm-pic svg { width: 100%; height: 100%; max-height: 100%; }
.asm-none { color: #6b747c; font-size: 14px; }
.asm-side { display: flex; flex-direction: column; min-height: 0; overflow: auto; padding-right: 4px; }
.asm-n { color: var(--teal); font: 600 12.5px var(--head); text-transform: uppercase; letter-spacing: .06em; }
.asm-side h3 { margin: 4px 0 8px; font: 700 20px var(--head); }
.asm-side p { margin: 0 0 14px; color: var(--text); font-size: 14px; line-height: 1.5; }
.asm-nav { display: flex; gap: 8px; margin-bottom: 14px; }
.asm-nav .btn { flex: 1; }
.asm-list { margin: 0; padding: 0 0 0 22px; color: var(--muted); font-size: 13px; }
.asm-list button { background: none; border: 0; color: var(--muted); padding: 3px 0; text-align: left; cursor: pointer; font: inherit; }
.asm-list button:hover { color: var(--text); }
.asm-list button[aria-current="true"] { color: var(--text); font-weight: 700; }
.asm-note { margin-top: 12px; color: var(--muted); font-size: 12px; }
.vbar .ghost[aria-pressed="true"] { color: var(--text); border-color: var(--teal); }
@media (max-width: 900px) {
  .asm { grid-template-columns: 1fr; grid-template-rows: minmax(220px, 55%) auto; }
}

.asm-pic { position: relative; user-select: none; -webkit-user-select: none; }
.asm-svg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.asm-svg svg { width: 100%; height: 100%; pointer-events: none; }
.asm-wm { position: absolute; inset: 0; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22420%22%20height%3D%22260%22%20viewBox%3D%220%200%20420%20260%22%3E%3Cg%20transform%3D%22rotate%28-24%20210%20130%29%22%20fill%3D%22%230b6f91%22%20fill-opacity%3D%220.13%22%20font-family%3D%22Arial%2C%20sans-serif%22%20font-weight%3D%22700%22%20text-anchor%3D%22middle%22%3E%3Ctext%20x%3D%22210%22%20y%3D%22118%22%20font-size%3D%2230%22%3EPREVIEW%20ONLY%3C/text%3E%3Ctext%20x%3D%22210%22%20y%3D%22152%22%20font-size%3D%2216%22%3EGorilla%20Tables%20%C2%B7%20fabricationtables.com%3C/text%3E%3C/g%3E%3C/svg%3E"); background-repeat: repeat; background-position: center; border-radius: 10px; }
.qopts { display: grid; gap: 6px; margin: 2px 0 4px; }
.qsel { display: grid; grid-template-columns: 46px 1fr; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.qsel .sel { width: 100%; }
.qall { align-items: center; gap: 14px; }
.qall .qsel { grid-template-columns: auto minmax(160px, 1fr); }
.applybar { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 18px; padding: 12px 0; background: var(--bg); border-top: 1px solid var(--line); z-index: 3; }
.applybar .status { margin: 0 0 0 6px; }
.applybar .spacer { flex: 1; }

/* hover cards: what an option does, with a small drawing of this table */
#tip { position: fixed; z-index: 60; width: 290px; padding: 10px 12px 12px; background: var(--panel); color: var(--text); border: 1px solid var(--line2);
  border-radius: 8px; box-shadow: 0 10px 28px var(--shadow); pointer-events: none; opacity: 0; transform: translateY(4px);
  transition: opacity .12s ease, transform .12s ease; left: -9999px; top: 0; }
#tip.on { opacity: 1; transform: none; }
#tip b { display: block; font-family: var(--head); font-size: 15px; font-weight: 700; color: var(--teal); margin-bottom: 3px; }
#tip p { margin: 0 0 8px; font-size: 13px; line-height: 1.35; color: var(--text); }
#tip .tip-pic { background: #f7f9fa; border: 1px solid var(--line); border-radius: 6px; padding: 4px; display: flex; justify-content: center; }
#tip .tip-pic svg { display: block; max-width: 100%; height: auto; }
#tip p:last-child { margin-bottom: 0; }
[data-tip] .label, [data-tip] > label { cursor: help; }

/* nested option groups, under the control they belong to */
details.sub { margin: -4px 0 14px; border-left: 2px solid var(--line2); padding-left: 12px; }
details.sub > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 8px; color: var(--teal); font-weight: 600; font-size: 13.5px; padding: 3px 0 6px; }
details.sub > summary::-webkit-details-marker { display: none; }
details.sub > summary::before { content: ''; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s; flex: none; align-self: center; }
details.sub[open] > summary::before { transform: rotate(45deg); }
details.sub > summary small { color: var(--muted); font-weight: 500; }
details.sub > summary:hover { color: var(--teal-hover); }
details.sub[open] { border-left-color: var(--teal-dim); }
.sub-body { padding-top: 4px; }

/* website: the three ways to buy, on the Review and order step */
.tiers { display: grid; gap: 10px; margin: 8px 0 14px; }
.tier-card { text-align: left; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; color: var(--text); cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font: inherit; }
.tier-card:hover { border-color: var(--line2); }
.tier-card[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-wash); }
.tier-card b { font: 700 16px var(--head); }
.tier-card .tp { font: 700 19px var(--head); color: var(--teal); text-align: right; }
.tier-card small { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; }
.tier-card ul { grid-column: 1 / -1; margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
.tier-card ul li::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--teal); margin-right: 8px; vertical-align: 2px; }
.tier-card.off { opacity: .55; cursor: not-allowed; }
